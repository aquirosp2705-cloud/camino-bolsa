<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/camino-bolsa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Juego de simulacion bursatil: aprende a invertir de $100.000 a $100.000.000.">
  <meta name="theme-color" content="#0E1116">

  <!-- iOS / iPad: instalar como app a pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bolsa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Camino al Experto en Bolsa</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Registro del service worker para poder JUGAR SIN INTERNET.
    Flutter 3.44 ya no registra su service worker (lo dejó obsoleto), así que lo
    registramos aquí. El archivo flutter_service_worker.js se reemplaza tras la
    compilación (tools/gen_offline_sw.ps1) por uno que guarda TODA la app.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      function removeBanner() {
        var b = document.getElementById('offline-banner');
        if (b) {
          b.style.opacity = '0';
          setTimeout(function () { if (b && b.parentNode) b.parentNode.removeChild(b); }, 400);
        }
      }
      function banner(text, color, dismissable) {
        var b = document.getElementById('offline-banner');
        if (!b) {
          b = document.createElement('div');
          b.id = 'offline-banner';
          b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;' +
            'padding:16px;text-align:center;color:#fff;cursor:pointer;' +
            'font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +
            'box-shadow:0 2px 10px rgba(0,0,0,.35);transition:opacity .4s;';
          b.onclick = removeBanner;
          document.body.appendChild(b);
        }
        b.style.background = color;
        b.textContent = text + (dismissable ? '   (toca para cerrar)' : '');
        b.style.opacity = '1';
      }
      function hideBanner(delay) {
        setTimeout(removeBanner, delay);
      }

      // ¿Están ya guardados los archivos esenciales para jugar sin internet?
      async function coreCached() {
        try {
          var keys = await caches.keys();
          for (var i = 0; i < keys.length; i++) {
            var reqs = await (await caches.open(keys[i])).keys();
            var urls = reqs.map(function (r) { return r.url; });
            var hasEngine = urls.some(function (u) { return u.indexOf('canvaskit/canvaskit.wasm') >= 0; });
            var hasApp = urls.some(function (u) { return u.indexOf('main.dart.js') >= 0; });
            if (hasEngine && hasApp) return true;
          }
        } catch (e) {}
        return false;
      }

      // Cuando entra una versión nueva del modo offline, recarga una vez para
      // mostrarla (así no se queda pegada en la versión vieja).
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=3561619502') /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */.catch(function (e) {
          console.warn('No se pudo registrar el modo offline:', e);
        });

        coreCached().then(function (already) {
          if (already) {
            // Ya estaba guardado: aviso que se queda hasta que lo toque.
            banner('✅ Guardado: ya puedes jugar SIN internet (modo avión)', '#16A34A', true);
            hideBanner(25000);
            return;
          }
          banner('⏳ Guardando el juego para jugar sin internet… espera al aviso VERDE', '#B8860B', false);
          var tries = 0;
          var timer = setInterval(function () {
            tries++;
            coreCached().then(function (ok) {
              if (ok) {
                clearInterval(timer);
                banner('✅ ¡Listo! Ya puedes jugar SIN internet (modo avión)', '#16A34A', true);
                hideBanner(25000);
              } else if (tries > 80) {
                clearInterval(timer); // conexión muy lenta o cortada
              }
            });
          }, 1500);
        });
      });
    })();
  </script>
</body>
</html>
